<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duel Arena - Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #34495e;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 300px;
            text-align: center;
        }
        h1 { margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            box-sizing: border-box; /* Fixes padding issues */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        button:hover { background-color: #2ecc71; }
        .toggle-btn {
            background: none;
            color: #bdc3c7;
            text-decoration: underline;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .hidden { display: none; }
        #message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="title">Login</h1>
        
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <p id="message"></p>
        
        <button class="toggle-btn" id="toggleMode">Need an account? Register</button>
    </div>

    <script>
        const form = document.getElementById('authForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleMode');
        const title = document.getElementById('title');
        const message = document.getElementById('message');

        let isLoginMode = true;

        // Toggle between Login and Register
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            title.textContent = isLoginMode ? 'Login' : 'Register';
            submitBtn.textContent = isLoginMode ? 'Sign In' : 'Sign Up';
            toggleBtn.textContent = isLoginMode ? 'Need an account? Register' : 'Have an account? Login';
            message.textContent = ''; // Clear old messages
        });

        // Handle Form Submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value;
            const password = passwordInput.value;
            const endpoint = isLoginMode ? '/login' : '/register';

            message.textContent = 'Processing...';
            message.className = '';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = data.message || (isLoginMode ? 'Login Successful!' : 'Registered Successfully!');
                    message.className = 'success';
                    
                    // Optional: Redirect on success
                    if (isLoginMode) {
                        setTimeout(() => {
                            // window.location.href = '/game.html'; // Uncomment if you have a game page
                        }, 1000);
                    }
                } else {
                    message.textContent = data.message || 'Action failed.';
                    message.className = 'error';
                }
            } catch (error) {
                console.error('Error:', error);
                message.textContent = 'Server error. Please try again.';
                message.className = 'error';
            }
        });
    </script>
</body>
</html>
